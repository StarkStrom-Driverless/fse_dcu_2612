#            LVGL             #
###############################
CONFIG_LVGL=y
CONFIG_LV_USE_LOG=y
# CONFIG_LV_Z_LOG_LEVEL=3

CONFIG_LV_Z_SHELL=y

#
# Widgets
#

CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_LED=y
CONFIG_LV_USE_SLIDER=y
CONFIG_LV_USE_SPAN=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_CANVAS=y

#
# Options
#
# CONFIG_LV_USE_GRADIENT=y
CONFIG_LV_USE_DRAW_SW_COMPLEX_GRADIENTS=y
CONFIG_LV_COLOR_DEPTH_16=y

# Float Support
CONFIG_LV_USE_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Observer pattern (lv_subject_t) — the foundation of the generated UI data
# binding (src/generated/ui_subjects_gen.*)
CONFIG_LV_USE_OBSERVER=y

#
# Memory
# 
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION=y
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION_NAME="DTCM"
CONFIG_LV_Z_MEM_POOL_SIZE=65536
# CONFIG_LV_Z_MEM_POOL_SIZE=49152
# CONFIG_LV_Z_MEM_POOL_SIZE=24576
# CONFIG_LV_Z_MEM_POOL_SIZE=23040 Minimum

#
# Framebuffer
#
CONFIG_LV_Z_VDB_SIZE=20
CONFIG_LV_Z_DOUBLE_VDB=n