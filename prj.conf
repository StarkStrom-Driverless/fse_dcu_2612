###############################
#           Zephyr            #
###############################
# main() ruft nur 3 init-Funktionen auf und kehrt sofort zurück — 2048 reicht.
# (Der alte Wert 8192 war für den QEMU-Cortex-A53-Simulator nötig; auf dem MCU
#  zu groß und verursacht RAM-Overflow.)
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_DISPLAY=y

CONFIG_LED_STRIP=y
CONFIG_LED_STRIP_LOG_LEVEL_DBG=y

#
# CAN Bus
#
CONFIG_CAN=y
# CONFIG_CAN_LOG_LEVEL_DBG=n

#
# Input subsystem (encoders, buttons)
# Required for INPUT_CALLBACK_DEFINE (left encoder carousel navigation)
#
CONFIG_INPUT=y

# 
# DMA
# 
CONFIG_DMA=y
CONFIG_DMA_STM32=y

# 
# SPI
# 
CONFIG_SPI_STM32_DMA=y
# CONFIG_SPI_LOG_LEVEL_DBG=y

#
# Persistent settings
#
# Off until the external SPI NOR flash is populated.  The settings service
# still runs and keeps its full API; values simply start from the schema
# defaults on every boot.
#
# Turning this on also requires a storage_partition in the devicetree and
# CONFIG_USE_DT_CODE_PARTITION so the linker cannot let the firmware grow
# into it.  See docs/settings_module.md.
#
CONFIG_DCU_SETTINGS_PERSIST=n

#
# Zbus — inter-module event and command bus
#
CONFIG_ZBUS=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_RUNTIME_OBSERVERS=y

CONFIG_SHELL=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y

CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# 
# Clock Control
# 
# CONFIG_CLOCK_CONTROL_LOG_LEVEL_DBG=y

#
# Logs
#
CONFIG_LOG=y
CONFIG_DISPLAY_LOG_LEVEL_ERR=y
# CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3

#
# CPU Usage Report
#
# CONFIG_THREAD_RUNTIME_STATS=y
# CONFIG_CPU_LOAD=y
# CONFIG_CPU_LOAD_LOG_PERIODICALLY=1000

# 
# Compile Options
# 
# CONFIG_DEBUG=y
CONFIG_FAULT_DUMP=2
CONFIG_SPEED_OPTIMIZATIONS=y


###############################
#            LVGL             #
###############################
CONFIG_LVGL=y
CONFIG_LV_USE_LOG=y
# CONFIG_LV_Z_LOG_LEVEL=3

CONFIG_LV_Z_SHELL=y

#
# Widgets
#

CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_LED=y
CONFIG_LV_USE_SLIDER=y
CONFIG_LV_USE_SPAN=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_CANVAS=y

#
# Options
#
# CONFIG_LV_USE_GRADIENT=y
CONFIG_LV_USE_DRAW_SW_COMPLEX_GRADIENTS=y
CONFIG_LV_COLOR_DEPTH_16=y

# Float Support
CONFIG_LV_USE_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Observer-Pattern (lv_subject_t) — Grundlage der generierten
# UI-Datenbindung (src/generated/ui_subjects_gen.*)
CONFIG_LV_USE_OBSERVER=y

#
# Memory
# 
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION=y
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION_NAME="DTCM"
CONFIG_LV_Z_MEM_POOL_SIZE=65536
# CONFIG_LV_Z_MEM_POOL_SIZE=49152
# CONFIG_LV_Z_MEM_POOL_SIZE=24576
# CONFIG_LV_Z_MEM_POOL_SIZE=23040 Minimum

#
# Framebuffer
#
CONFIG_LV_Z_VDB_SIZE=20
CONFIG_LV_Z_DOUBLE_VDB=n