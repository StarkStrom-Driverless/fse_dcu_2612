###############################
#           Zephyr            #
###############################
# main() only calls 3 init functions and returns immediately — 2048 is enough.
# (The old value of 8192 was needed for the QEMU Cortex-A53 simulator; on the
#  MCU it is too large and overflows RAM.)
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_DISPLAY=y

CONFIG_LED_STRIP=y
CONFIG_LED_STRIP_LOG_LEVEL_DBG=y

#
# CAN Bus
#
CONFIG_CAN=y
# CONFIG_CAN_LOG_LEVEL_DBG=n

#
# Input subsystem (encoders, buttons)
# Required for INPUT_CALLBACK_DEFINE (left encoder carousel navigation)
#
CONFIG_INPUT=y

# 
# DMA
# 
CONFIG_DMA=y
CONFIG_DMA_STM32=y

# 
# SPI
# 
CONFIG_SPI_STM32_DMA=y
# CONFIG_SPI_LOG_LEVEL_DBG=y

#
# Persistent settings
#
# Stored in NVS on the external SPI NOR flash (AT25DF081A on SPI1), in the
# settings_partition the DCU shield overlay defines.  The internal flash is
# untouched: its 128 KB sectors would have cost 256 KB of application space,
# while the external part erases in 4 KB sectors.
#
# The SPI NOR driver comes in through the devicetree node (CONFIG_SPI_NOR
# defaults to y once a jedec,spi-nor node is enabled); NVS, SETTINGS, FLASH and
# FLASH_MAP are selected by CONFIG_DCU_SETTINGS_PERSIST itself.
#
# The emulator has no such flash — see boards/qemu_cortex_a53.conf.
#
CONFIG_DCU_SETTINGS_PERSIST=y

# Erase unit the flash layout reports, and with it the NVS sector size.
#
# The driver defaults to the 64 KB block erase. NVS keeps its sector size in a
# uint16_t, so 65536 does not fit and settings_backend_init() bails out with
# -EDOM before anything is ever written. 4096 is the AT25DF081A's own sector
# erase — it fits, and it wears the part far less than erasing 64 KB to rewrite
# a seven-byte blob.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

#
# Zbus — inter-module event and command bus
#
CONFIG_ZBUS=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_RUNTIME_OBSERVERS=y

#
# SMF — operating-mode state machine in the App Layer (src/app/state_machine.c)
#
CONFIG_SMF=y

CONFIG_SHELL=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y

CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# 
# Clock Control
# 
# CONFIG_CLOCK_CONTROL_LOG_LEVEL_DBG=y

#
# Logs
#
CONFIG_LOG=y
CONFIG_DISPLAY_LOG_LEVEL_ERR=y
# CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Deferred logging buffers the messages until the log thread gets around to
# them. The thread analyzer emits its whole report in one go — two lines per
# thread plus the ISR stacks, roughly two dozen messages — without yielding,
# and the log thread runs at the lowest application priority, so all of them
# have to fit in here at once. The 1024 byte default drops most of the report.
CONFIG_LOG_BUFFER_SIZE=4096

#
# CPU Usage Report
#
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_CPU_LOAD=y
CONFIG_CPU_LOAD_LOG_PERIODICALLY=1000

#
# Thread analyzer — periodic stack headroom report
#
# Prints one block per thread: bytes unused, bytes used, stack size, percentage
# and CPU share. The numbers come from INIT_STACKS, which paints every stack
# with a known pattern at creation; the analyzer then counts how far down the
# pattern is still intact. It therefore reports the *high-water mark* since
# boot, not the momentary depth — which is exactly what a stack size has to be
# dimensioned against.
#
# Nothing is free here, but most of it was already paid for: INIT_STACKS,
# THREAD_MONITOR and THREAD_STACK_INFO are selected by THREAD_ANALYZER and were
# already on for the kernel shell. What is new is the analyzer thread itself
# (THREAD_ANALYZER_AUTO_STACK_SIZE, 1024 by default).
#
# On demand rather than periodically: `kernel stacks` on the shell prints the
# same figures once. CONFIG_KERNEL_SHELL is already enabled.
#
# This is instrumentation. Comment the block out for anything that goes on the
# car — or move it to its own EXTRA_CONF_FILE overlay, the way debug_rtt.conf
# keeps the RTT shell out of the default build.
#
# CONFIG_THREAD_ANALYZER=y
# CONFIG_THREAD_ANALYZER_USE_LOG=y
# CONFIG_THREAD_ANALYZER_ISR_STACK_USAGE=y

# Run it from its own thread instead of calling thread_analyzer_print() by hand.
# CONFIG_THREAD_ANALYZER_AUTO=y

# Seconds between reports. Kconfig accepts 5…3600; every 5 s is a lot of text
# next to the 1 Hz CPU-load line, so this is deliberately slower.
# CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=10

# Keep the diagnostic behind every functional thread. The analyzer defaults to
# priority 0, which would preempt CAN (3), App (5), Audio (6), Lighting (7) and
# UI (8) for the whole scan — it walks every stack word by word. At 9 it only
# ever runs when nothing else wants the CPU.
# CONFIG_THREAD_ANALYZER_AUTO_THREAD_PRIORITY_OVERRIDE=y
# CONFIG_THREAD_ANALYZER_AUTO_THREAD_PRIORITY=9

#
# Stack overflow detection
#
# Without this a thread that runs off the end of its stack does not fault — it
# writes into whatever RAM happens to lie below, and the damage surfaces later
# somewhere unrelated. The sentinel puts a magic word at the lowest address of
# every stack and checks it on every context switch, on every interrupt that
# does not switch, on k_yield() and when a thread returns. A thread that has
# scribbled over it is killed with a fatal error naming it, which FAULT_DUMP=2
# then prints.
#
# This is the software variant. The stronger one — CONFIG_ARM_MPU=y plus
# CONFIG_HW_STACK_PROTECTION=y — traps the very first access past the end
# instead of catching it at the next check, but it does not fit this image:
#
#   ARM_MPU selects MPU_REQUIRES_POWER_OF_TWO_ALIGNMENT on ARMv7-M, and the
#   linker then aligns the end of the read-only region to the next power of two
#   of its own size (MPU_ALIGN in the Cortex-M linker script). At ~783 KB of
#   text plus rodata that rounds up to 1 MB, which is exactly the size of the
#   STM32F405RG's flash — the load addresses of the initialised data sections
#   would land past the end of it and the link fails.
#
#   Ways out, none of them free: CONFIG_CUSTOM_SECTION_ALIGN=y skips that
#   alignment but then the MPU regions have to be configured by hand, or the
#   image has to shrink below 512 KB. Worth revisiting if the image ever does.
#
# The sentinel is mutually exclusive with MPU_STACK_GUARD; Kconfig enforces it.
#
CONFIG_STACK_SENTINEL=y

#
# Compile Options
#
# CONFIG_DEBUG=y
CONFIG_FAULT_DUMP=2
CONFIG_SPEED_OPTIMIZATIONS=y


