# ─────────────────────────────────────────────────────────────────────────────
# dcu_app.yaml — Applikations-Intent für den CAN-Code-Generator
#
# Regeln:
#   * Die DBC (dcu_can.dbc) ist die einzige Wahrheit für das Bit-Layout.
#     Diese Datei referenziert DBC-Namen, dupliziert aber nichts daraus.
#   * Nur Messages, die hier gelistet sind, werden generiert (Whitelist).
#   * limits sind in physikalischen Einheiten (nach DBC-Faktor/Offset).
#     Semantik (alle Grenzen optional):
#       value <  critical_low                  → CRITICAL
#       value <  warning_low                   → WARNING
#       warning_low <= value <= warning_high   → OK
#       value >  warning_high                  → WARNING
#       value >  critical_high                 → CRITICAL
#     Validierung: critical_low <= warning_low <= warning_high <= critical_high
#   * range gibt den absoluten Anzeigebereich in physikalischen Einheiten an.
#     Wird als UI_<NAME>_RANGE_MIN / UI_<NAME>_RANGE_MAX in ui_subjects_gen.h
#     generiert. Verwendung z.B.: lv_bar_set_range(bar, UI_X_RANGE_MIN, UI_X_RANGE_MAX)
#     min und max sind jeweils optional; wenn beide angegeben, muss min < max sein.
#   * persist markiert ein TX-Signal als über Neustart hinweg speicherbar.
#     Erzeugt einen Eintrag in settings_schema_gen.h. Pflichtfeld: default.
#     min/max sind optional — ohne Angabe gilt der Bereich aus der DBC-Bitbreite
#     (N Bit unsigned → [0, 2^N-1]) bzw. das explizite DBC-Minimum/Maximum.
#     Siehe docs/settings_module.md.
#
# Regenerieren: python3 tools/codegen/gen_can.py   (west-venv aktiv)
# ─────────────────────────────────────────────────────────────────────────────

version: 1

# ── Persistente Einstellungen ohne CAN-Signal ────────────────────────────────
#
# CAN-gebundene Settings werden am Signal per `persist:` markiert (siehe
# messages: unten). Dieser Block ist für Werte, hinter denen kein CAN-Signal
# steht. Beide Quellen landen in derselben enum setting_id.
#
settings:
  display_brightness:
    default: 80
    min: 0
    max: 100

messages:

  # ── TX: DCU → mABX ─────────────────────────────────────────────────────────

  DCU_2_mABX:
    direction: tx
    period_ms: 100
    signals:
      Debug_SETTING:
        app_name: debug_bits
        persist: { default: 0 }
      DV_Drive_Mode_SETTING:
        app_name: drive_mode
      RTD_Button:
        app_name: rtd_button
      DCU_RESERVE_BUTTON:
        app_name: reserve_button
      ASR_SETTING:
        app_name: asr_setting
        persist: { default: 0 }
      Rekuperation_SETTING:
        app_name: rekup_setting
        persist: { default: 0 }
      Torque_Vectoring_SETTING:
        app_name: torquevect_setting
        persist: { default: 0 }
      Power_Limit_SETTING:
        app_name: pwrlimit_setting
        persist: { default: 0 }


  # ── RX: mABX → DCU ─────────────────────────────────────────────────────────

  mABX_2_DCU_1:
    direction: rx
    timeout_ms: 500
    signals:
      LED_1:
        app_name: dv_receiving
        ui: { label: "Incoming ROS signals" }
      LED_2:
        app_name: dv_ready
        ui: { label: "Incoming valid DV signals" }
      LED_3:
        app_name: sdc_open
        ui: { label: "SDC Open" }
      LED_4:
        app_name: datalogger_ready
        ui: { label: "Logger Ready" }
      LED_5:
        app_name: datalogger_recording
        ui: { label: "Logger Recording" }
      LED_6:
        app_name: rtd_possible
        ui: { label: "RTD Requirements met" }
      LED_7:
        app_name: startup_finish
        ui: { label: "Startup finish" }
      LED_8:
        app_name: kistler_timeout
        ui: { label: "Kistler Timeout" }
      DCU_RGB_LED_Themperatur:
        app_name: temperature_generic
      DCU_RESERVE_LED:
        app_name: led_reserved_0
      Leistung_Durschnitt:
        app_name: power_average
        ui: { label: "Power Avg", precision: 0 }
        limits: { warning_high: 60, critical_high: 75 }
        range: { min: 0, max: 80 }

  mABX_2_DCU_2:
    direction: rx
    timeout_ms: 500
    signals:
      DCU_Temperatur_Akku:
        app_name: temperature_accu_hv
        ui: { label: "Accu Temp", precision: 0 }
        # Beispielwerte — an reale Fahrzeugdaten anpassen!
        limits: { warning_high: 50, critical_high: 60 }
        range: { min: 0, max: 80 }
      DCU_Temperatur_Umrichter:
        app_name: temperature_inverter
        ui: { label: "Inverter Temp", precision: 0 }
        limits: { warning_high: 70, critical_high: 90 }
        range: { min: 0, max: 120 }
      DCU_Temperatur_Motor:
        app_name: temperature_motor
        ui: { label: "Motor Temp", precision: 0 }
        limits: { warning_high: 80, critical_high: 100 }
        range: { min: 0, max: 120 }
      HV_VOLT_AKKU:
        app_name: voltage_accu_hv
        ui: { label: "HV Accu", precision: 0 }
        limits: { critical_low: 470, warning_low: 488 }
        range: { min: 400, max: 600 }
      HV_VOLT_TS:
        app_name: voltage_tractive_system
        ui: { label: "HV TS", precision: 0 }
      DCU_Custom_Wert_1:
        app_name: custom_1
      DCU_Custom_Wert_2:
        app_name: custom_2

  M01_Brake_Pressure_Front:
    direction: rx
    timeout_ms: 500
    signals:
      Brake_Pressure_Front:
        app_name: brake_pressure_front
        ui: { label: "Brake Pressure Front", precision: 0 }
        limits: { warning_high: 50, critical_high: 60 }

  M01_Brake_Pressure_Rear:
    direction: rx
    timeout_ms: 500
    signals:
      Brake_Pressure_Rear:
        app_name: brake_pressure_rear
        ui: { label: "Brake Pressure Rear", precision: 0 }
        limits: { warning_high: 50, critical_high: 60 }

  Air_Pressure_front:
    direction: rx
    timeout_ms: 500
    signals:
      Pressure:
        app_name: air_pressure_front
        ui: { label: "Air Pressure Front", precision: 0 }
        limits: { warning_high: 50, critical_high: 60 }

  Air_Pressure_rear:
    direction: rx
    timeout_ms: 500
    signals:
      Pressure:
        app_name: air_pressure_rear
        ui: { label: "Air Pressure Rear", precision: 0 }
        limits: { warning_high: 50, critical_high: 60 }

  RFC4800_APPS_L:
    direction: rx
    timeout_ms: 500
    signals:
      APPS_L_Position:
        app_name: apps_left_position
        ui: { label: "Left Accelerator Pedal Position", precision: 0 }
        limits: { warning_high: 50, critical_high: 60 }
        range: { min: 0, max: 100 }

  RFC4800_APPS_R:
    direction: rx
    timeout_ms: 500
    signals:
      APPS_R_Position:
        app_name: apps_right_position
        ui: { label: "Right Accelerator Pedal Position", precision: 0 }
        limits: { warning_high: 50, critical_high: 60 }
        range: { min: 0, max: 100 }

  RFC4800_BPPS:
    direction: rx
    timeout_ms: 500
    signals:
      BPPS_Position:
        app_name: bpps_position
        ui: { label: "Break Pedal Position", precision: 0 }
        limits: { warning_high: 50, critical_high: 60 }
        range: { min: 0, max: 100 }

  SensorUnitRear_2_Vehicle:
    direction: rx
    timeout_ms: 500
    signals:
      SDC_MON_BSPD:
        app_name: sdc_bspd
        ui: { label: "", precision: 0 }
      SDC_MON_SDB_COCKPIT:
        app_name: sdc_cockpit
        ui: { label: "", precision: 0 }
      SDC_MON_ASCU:
        app_name: sdc_ascu
        ui: { label: "", precision: 0 }
      SDC_MON_MOTOREN_RL:
        app_name: sdc_motor_rl
        ui: { label: "", precision: 0 }
      SDC_MON_HVD:
        app_name: sdc_hvd
        ui: { label: "", precision: 0 }
      SDC_MON_MOTOREN_RR:
        app_name: sdc_motor_rr
        ui: { label: "", precision: 0 }
      SDC_MON_SDB_MH:
        app_name: sdc_sdb_mh
        ui: { label: "", precision: 0 }
      LV_Akku:
        app_name: lv_accu_voltage
        ui: { label: "", precision: 0 }
        limits: { warning_low: 22, critical_low: 21 }

  SensorUnitFront_2_Vehicle:
    direction: rx
    timeout_ms: 500
    signals:
      SDC_MON_RES:
        app_name: sdc_res
        ui: { label: "", precision: 0 }
      SDC_MON_MOTOREN_FL:
        app_name: sdc_motor_fl
        ui: { label: "", precision: 0 }
      SDC_MON_BOTS:
        app_name: sdc_bots
        ui: { label: "", precision: 0 }
      SDC_MON_MOTOREN_FR:
        app_name: sdc_motor_fr
        ui: { label: "", precision: 0 }
      SDC_MON_Inertia:
        app_name: sdc_inertia
        ui: { label: "", precision: 0 }

  MABX_2_Vehicle:
    direction: rx
    timeout_ms: 500
    signals:
      RTD_Sound:
        app_name: rtd_sound
        ui: { label: "", precision: 0 }
      RTD_State:
        app_name: rtd_state
        ui: { label: "", precision: 0 }
      AMS_error:
        app_name: ams_error
        ui: { label: "", precision: 0 }
      IMD_error:
        app_name: imd_error
        ui: { label: "", precision: 0 }

  DV_system_status:
    direction: rx
    timeout_ms: 500
    signals:
      AS_state:
        app_name: as_state
        ui: { label: "", precision: 0 }

