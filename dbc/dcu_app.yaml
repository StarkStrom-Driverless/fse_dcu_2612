# ─────────────────────────────────────────────────────────────────────────────
# dcu_app.yaml — application intent for the CAN code generator
#
# Rules:
#   * The DBC (dcu_can.dbc) is the only truth for the bit layout. This file
#     references DBC names but duplicates nothing from them.
#   * Only messages listed here are generated (whitelist).
#   * limits are in physical units (after the DBC factor/offset).
#     Semantics, all limits optional:
#       value <  critical_low                  → CRITICAL
#       value <  warning_low                   → WARNING
#       warning_low <= value <= warning_high   → OK
#       value >  warning_high                  → WARNING
#       value >  critical_high                 → CRITICAL
#     Validation: critical_low <= warning_low <= warning_high <= critical_high,
#     and every limit lies inside `range` when one is given. A limit beyond the
#     range would turn the readout gold or red at a value the bar cannot show.
#   * range is the absolute display range in physical units — what a bar spans.
#     min and max are each optional; when both are given, min < max.
#   * ui says how a numeric signal is presented. All keys are optional:
#       label        full caption, as on a debug screen
#       short_label  compact caption for tight layouts; falls back to label
#       unit         unit suffix. Falls back to the DBC unit, so give it only
#                    where the DBC has none (or has it garbled).
#       precision    decimals shown, 0..4. Above 0 only for a signal with a
#                    factor or offset in the DBC, i.e. a float one.
#     Signals that are flags (one bit) get no presentation.
#   * label, unit, precision, range and limits end up together in one
#     `struct ui_signal_desc ui_sig_<app_name>` in ui_subjects_gen.h, and the
#     screens read everything from there: no caption, unit, format, bar range or
#     limit is written into a screen.
#   * persist marks a TX signal as storable across a restart. Creates an entry
#     in settings_schema_gen.h. Required: default. min/max are optional —
#     without them the range from the DBC bit width applies (N bit unsigned →
#     [0, 2^N-1]) or the explicit DBC minimum/maximum.
#     See src/services/settings/settings.h.
#
# Regenerate: python3 tools/codegen/gen_can.py   (west venv active)
# ─────────────────────────────────────────────────────────────────────────────

version: 1

# ── Persistent settings without a CAN signal ─────────────────────────────────
#
# CAN-bound settings are marked on the signal with `persist:` (see messages:
# below). This block is for values with no CAN signal behind them. Both sources
# end up in the same enum setting_id.
#
settings:
  display_brightness:
    default: 80
    min: 0
    max: 100

messages:

  # ── TX: DCU → mABX ─────────────────────────────────────────────────────────

  DCU_2_mABX:
    direction: tx
    period_ms: 100
    signals:
      Debug_SETTING:
        app_name: debug_bits
        persist: { default: 0 }
      DV_Drive_Mode_SETTING:
        app_name: drive_mode
      RTD_Button:
        app_name: rtd_button
      DCU_RESERVE_BUTTON:
        app_name: reserve_button
      ASR_SETTING:
        app_name: asr_setting
        persist: { default: 0 }
      Rekuperation_SETTING:
        app_name: rekup_setting
        persist: { default: 0 }
      Torque_Vectoring_SETTING:
        app_name: torquevect_setting
        persist: { default: 0 }
      Power_Limit_SETTING:
        app_name: pwrlimit_setting
        persist: { default: 0 }


  # ── RX: mABX → DCU ─────────────────────────────────────────────────────────
  #
  # Limits and ranges below are EXAMPLE VALUES — adjust them to the real vehicle
  # data. Where a signal has no limits, that is deliberate: it is an input or a
  # command (a pedal position, a brake pressure) and not a health value, and a
  # limit would color it during normal driving.

  mABX_2_DCU_1:
    direction: rx
    timeout_ms: 500
    signals:
      LED_1:
        app_name: dv_receiving
        ui: { label: "Incoming ROS signals" }
      LED_2:
        app_name: dv_ready
        ui: { label: "Incoming valid DV signals" }
      LED_3:
        app_name: sdc_open
        ui: { label: "SDC Open" }
      LED_4:
        app_name: datalogger_ready
        ui: { label: "Logger Ready" }
      LED_5:
        app_name: datalogger_recording
        ui: { label: "Logger Recording" }
      LED_6:
        app_name: rtd_possible
        ui: { label: "RTD Requirements met" }
      LED_7:
        app_name: startup_finish
        ui: { label: "Startup finish" }
      LED_8:
        app_name: kistler_timeout
        ui: { label: "Kistler Timeout" }
      DCU_RGB_LED_Themperatur:
        app_name: temperature_generic
      DCU_RESERVE_LED:
        app_name: led_reserved_0
      Leistung_Durschnitt:
        app_name: power_average
        ui: { label: "Power Average", short_label: "Power Avg", precision: 0 }   # unit kW from the DBC
        limits: { warning_high: 60, critical_high: 75 }
        range: { min: 0, max: 80 }

  mABX_2_DCU_2:
    direction: rx
    timeout_ms: 500
    signals:
      DCU_Temperatur_Akku:
        app_name: temperature_accu_hv
        ui: { label: "HV Accu Temperature", short_label: "HV Accu Temp", unit: "°C", precision: 0 }
        limits: { warning_high: 50, critical_high: 60 }
        range: { min: 0, max: 80 }
      DCU_Temperatur_Umrichter:
        app_name: temperature_inverter
        ui: { label: "Inverter Temperature", short_label: "Inverter Temp", unit: "°C", precision: 0 }
        limits: { warning_high: 70, critical_high: 90 }
        range: { min: 0, max: 120 }
      DCU_Temperatur_Motor:
        app_name: temperature_motor
        ui: { label: "Highest Motor Temperature", short_label: "Motor Temp", unit: "°C", precision: 0 }
        limits: { warning_high: 80, critical_high: 100 }
        range: { min: 0, max: 120 }
      HV_VOLT_AKKU:
        app_name: voltage_accu_hv
        ui: { label: "HV Accu Voltage", short_label: "HV Accu", unit: "V", precision: 0 }
        limits: { critical_low: 470, warning_low: 488, warning_high: 585, critical_high: 595 }
        range: { min: 0, max: 600 }
      HV_VOLT_TS:
        app_name: voltage_tractive_system
        # No limits: the tractive system is dead while it is switched off, and
        # 0 V is then the normal state, not a fault.
        ui: { label: "Tractive System Voltage", short_label: "HV TS", unit: "V", precision: 0 }
        range: { min: 0, max: 600 }
      DCU_Custom_Wert_1:
        app_name: custom_1
        ui: { label: "Custom Value 1", precision: 0 }
      DCU_Custom_Wert_2:
        app_name: custom_2
        ui: { label: "Custom Value 2", precision: 0 }

  M01_Brake_Pressure_Front:
    direction: rx
    timeout_ms: 500
    signals:
      Brake_Pressure_Front:
        app_name: brake_pressure_front
        ui: { label: "Brake Pressure Front", short_label: "Brake Front", precision: 2 }   # unit bar from the DBC
        limits: { warning_high: 50, critical_high: 55 }
        range: { min: 0, max: 60 }

  M01_Brake_Pressure_Rear:
    direction: rx
    timeout_ms: 500
    signals:
      Brake_Pressure_Rear:
        app_name: brake_pressure_rear
        ui: { label: "Brake Pressure Rear", short_label: "Brake Rear", precision: 2 }
        limits: { warning_high: 50, critical_high: 55 }
        range: { min: 0, max: 60 }

  # Air pressure is dangerous when it is too LOW — the pneumatics cannot work —
  # as well as too high, which is why all four limits are set here.
  Air_Pressure_front:
    direction: rx
    timeout_ms: 500
    signals:
      Pressure:
        app_name: air_pressure_front
        ui: { label: "Air Pressure Front", short_label: "Air Front", unit: "bar", precision: 2 }
        limits: { critical_low: 3, warning_low: 5, warning_high: 9, critical_high: 9.5 }
        range: { min: 0, max: 10 }

  Air_Pressure_rear:
    direction: rx
    timeout_ms: 500
    signals:
      Pressure:
        app_name: air_pressure_rear
        ui: { label: "Air Pressure Rear", short_label: "Air Rear", unit: "bar", precision: 2 }
        limits: { critical_low: 3, warning_low: 5, warning_high: 9, critical_high: 9.5 }
        range: { min: 0, max: 10 }

  RFC4800_APPS_L:
    direction: rx
    timeout_ms: 500
    signals:
      APPS_L_Position:
        app_name: apps_left_position
        ui: { label: "Left Accelerator Pedal Position", short_label: "APPS L", unit: "", precision: 0 }
        range: { min: 0, max: 11000 }

  RFC4800_APPS_R:
    direction: rx
    timeout_ms: 500
    signals:
      APPS_R_Position:
        app_name: apps_right_position
        ui: { label: "Right Accelerator Pedal Position", short_label: "APPS R", unit: "", precision: 0 }
        range: { min: 0, max: 6000 }

  RFC4800_BPPS:
    direction: rx
    timeout_ms: 500
    signals:
      BPPS_Position:
        app_name: bpps_position
        ui: { label: "Brake Pedal Position", short_label: "BPPS", unit: "%", precision: 0 }
        range: { min: 0, max: 100 }

  SensorUnitRear_2_Vehicle:
    direction: rx
    timeout_ms: 500
    signals:
      SDC_MON_BSPD:
        app_name: sdc_bspd
        ui: { label: "", precision: 0 }
      SDC_MON_SDB_COCKPIT:
        app_name: sdc_cockpit
        ui: { label: "", precision: 0 }
      SDC_MON_ASCU:
        app_name: sdc_ascu
        ui: { label: "", precision: 0 }
      SDC_MON_MOTOREN_RL:
        app_name: sdc_motor_rl
        ui: { label: "", precision: 0 }
      SDC_MON_HVD:
        app_name: sdc_hvd
        ui: { label: "", precision: 0 }
      SDC_MON_MOTOREN_RR:
        app_name: sdc_motor_rr
        ui: { label: "", precision: 0 }
      SDC_MON_SDB_MH:
        app_name: sdc_sdb_mh
        ui: { label: "", precision: 0 }
      LV_Akku:
        app_name: lv_accu_voltage
        # The DBC gives 20..32.75 V for the LV battery, factor 0.1. Unit V from the DBC.
        ui: { label: "LV Accu Voltage", short_label: "LV Accu", precision: 1 }
        limits: { critical_low: 21, warning_low: 22, warning_high: 30, critical_high: 32 }
        range: { min: 0, max: 36 }

  SensorUnitFront_2_Vehicle:
    direction: rx
    timeout_ms: 500
    signals:
      SDC_MON_RES:
        app_name: sdc_res
        ui: { label: "", precision: 0 }
      SDC_MON_MOTOREN_FL:
        app_name: sdc_motor_fl
        ui: { label: "", precision: 0 }
      SDC_MON_BOTS:
        app_name: sdc_bots
        ui: { label: "", precision: 0 }
      SDC_MON_MOTOREN_FR:
        app_name: sdc_motor_fr
        ui: { label: "", precision: 0 }
      SDC_MON_Inertia:
        app_name: sdc_inertia
        ui: { label: "", precision: 0 }

  MABX_2_Vehicle:
    direction: rx
    timeout_ms: 500
    signals:
      RTD_Sound:
        app_name: rtd_sound
        ui: { label: "", precision: 0 }
      RTD_State:
        app_name: rtd_state
        ui: { label: "", precision: 0 }
      AMS_error:
        app_name: ams_error
        ui: { label: "", precision: 0 }
      IMD_error:
        app_name: imd_error
        ui: { label: "", precision: 0 }

  DV_system_status:
    direction: rx
    timeout_ms: 500
    signals:
      AS_state:
        app_name: as_state
        ui: { label: "", precision: 0 }

