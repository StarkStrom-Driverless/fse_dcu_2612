# Demo mode for the QEMU emulator: invented CAN data plus a tour through every
# screen, one every five seconds — for taking screenshots without touching
# anything.
#
#   west build -p always -b qemu_cortex_a53 -- -DEXTRA_CONF_FILE=demo.conf
#   west build -t run
#
# The tour visits twelve screens and starts over, so the emulator can simply be
# left running. Each stop is logged ("Demo: SDC"), which matches a screenshot to
# its screen when the window is captured on a timer.
#
# What it does and does not fake is in src/modules/demo/demo.c. In short: the
# snapshot the CAN module would publish is invented, everything below that is
# not exercised.
#
# Emulator only. CONFIG_DCU_DEMO_MODE depends on QEMU_TARGET, so this file has
# no effect on a hardware build — Kconfig then reports that the assignment did
# not take, which Zephyr turns into a build error. That is intended: a fake
# vehicle must never end up on a car.

CONFIG_DCU_DEMO_MODE=y

# Time per screen. 1000 to 60000.
# CONFIG_DCU_DEMO_SCREEN_PERIOD_MS=5000
