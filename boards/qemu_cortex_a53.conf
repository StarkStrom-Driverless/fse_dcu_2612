# QEMU Cortex-A53 – Abweichungen von prj.conf für den Emulator
# SPDX-License-Identifier: Apache-2.0

# LVGL-Speicherpool: auf dem STM32F405 liegt er im DTCM, einer eigenen
# Memory-Region des SoC. Auf QEMU gibt es die nicht — der Linker legt die
# Sektion dann als Orphan ab und der Build bricht mit
# "region `IDT_LIST' overflowed" ab. Ohne die Option landet der Pool im
# normalen SRAM, wovon der Emulator reichlich hat.
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION=n

# Kleiner als auf der Hardware (64 KB). Reicht für die Screens; das Minimum
# liegt laut Entwicklerhandbuch bei rund 23 KB.
CONFIG_LV_Z_MEM_POOL_SIZE=65536
