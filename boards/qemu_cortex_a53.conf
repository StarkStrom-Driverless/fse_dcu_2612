# QEMU Cortex-A53 – where the emulator differs from prj.conf
# SPDX-License-Identifier: Apache-2.0

# LVGL memory pool: on the STM32F405 it lives in DTCM, a memory region of its
# own on that SoC. QEMU has no such region — the linker then places the section
# as an orphan and the build fails with "region `IDT_LIST' overflowed". Without
# the option the pool lands in ordinary SRAM, which the emulator has plenty of.
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION=n

# Smaller than on the hardware (64 KB). Enough for the screens; the developer
# manual puts the minimum at roughly 23 KB.
CONFIG_LV_Z_MEM_POOL_SIZE=65536

# The emulator has neither the DCU board's SPI NOR flash nor, with it, the
# settings_partition the NVS backend points at. Settings therefore stay in RAM
# here: full API, but every start begins from the defaults generated out of
# dbc/dcu_app.yaml.
CONFIG_DCU_SETTINGS_PERSIST=n
