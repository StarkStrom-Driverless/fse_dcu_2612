# Out-of-tree driver module for the FSE DCU 2612.
#
# Keeps custom drivers and their devicetree bindings inside this repository
# instead of patched into the Zephyr tree.  Previously the HX8357 driver was
# registered by editing drivers/display/CMakeLists.txt and drivers/display/
# Kconfig upstream — modifications no workspace clone would carry.
#
# Pulled in by CMakeLists.txt via ZEPHYR_EXTRA_MODULES.

name: fse_dcu_drivers

build:
  cmake: .
  kconfig: Kconfig

settings:
  # Makes dts/bindings/ here visible to the devicetree compiler.  Without it
  # the himax,hx8357 node gets no property macros and every DT_PROP() on it
  # fails to compile.
  dts_root: .
